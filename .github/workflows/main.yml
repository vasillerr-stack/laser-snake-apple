name: Build game

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v5

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-openal
            mingw-w64-ucrt-x86_64-flac
            mingw-w64-ucrt-x86_64-libvorbis
            git

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release --parallel 2

      - name: Prepare Windows files
        shell: msys2 {0}
        run: |
          cp build/_deps/sfml-build/lib/sfml-*.dll build/
          cp /ucrt64/bin/openal32.dll build/
          cp /ucrt64/bin/libFLAC*.dll build/ 2>/dev/null || true
          cp /ucrt64/bin/libvorbis*.dll build/ 2>/dev/null || true
          cp /ucrt64/bin/libogg*.dll build/ 2>/dev/null || true
          cp /ucrt64/bin/libgcc_s_seh-1.dll build/ 2>/dev/null || true
          cp /ucrt64/bin/libstdc++-6.dll build/ 2>/dev/null || true
          cp /ucrt64/bin/libwinpthread-1.dll build/ 2>/dev/null || true

      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: LASER-SNAKE-Windows
          path: |
            build/LASER_SNAKE.exe
            build/*.dll
          if-no-files-found: error
